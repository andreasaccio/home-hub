# Mosquitto del Home Hub -> /etc/mosquitto/conf.d/homehub.conf
# Installato da install/setup-mosquitto.sh. Non modificare sul Pi: si modifica qui.
#
# Due listener, ognuno con le sue regole (per_listener_settings):
#
#  1883  tutte le interfacce: LAN 192.168.133.0/24 e VPN (tun0, per Camper Hub).
#        Solo utenti con password (/etc/mosquitto/passwd, fuori dal repo);
#        ogni utente vede solo i propri topic (/etc/mosquitto/acl).
#        Il router non inoltra la 1883: da Internet non e' raggiungibile.
#
#  1884  solo 127.0.0.1, senza password. Lo usano openHAB e i comandi di prova
#        sul Pi: cosi' nei file di openHAB nel repo non serve nessuna password.

per_listener_settings true

listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

listener 1884 127.0.0.1
allow_anonymous true
