# Add-on di openHAB gestiti dal repo home-hub.
# openHAB li installa da solo quando il file cambia.
# Formato: tipo = id1,id2,...

binding = shelly,mqtt,http,homekit
persistence = rrd4j
transformation = jsonpath
# Basic UI: disegna nel browser la sitemap (sitemaps/homehub.sitemap).
# Main UI c'e' sempre; l'app iPhone legge la sitemap via REST e non ne ha bisogno.
ui = basic
