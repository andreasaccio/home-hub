# Backup notturno del Home Hub - copiato in /etc/homehub/backup.conf da
# install/setup-backup.sh. Nessun segreto: la chiave SSH sta in /root/.ssh,
# la chiave privata gpg solo fuori dal Pi.

# Synology: utente dedicato con accesso alla sola cartella condivisa
NAS_HOST=192.168.133.194
NAS_USER=homehub-backup
NAS_PATH=/volume1/homehub-backup
SSH_KEY=/root/.ssh/homehub-backup
KNOWN_HOSTS=/etc/homehub/backup_known_hosts

# Archivi sul Pi (la copia sul Synology e' lo specchio di questa cartella)
OUTDIR=/var/backups/homehub

# Conservazione: l'ultimo di ciascuno degli ultimi N giorni, settimane, mesi
KEEP_DAILY=14
KEEP_WEEKLY=8
KEEP_MONTHLY=12
